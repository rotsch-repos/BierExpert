; Vorlage — wird von deploy/lokal/einrichten.sh nach
; /etc/php/<version>/fpm/pool.d/bierexpert.conf installiert.
;
; Ein eigener Pool neben dem mitgelieferten "www": Was hier an Zeitgrenzen
; und Rechten steht, gilt nur für diese Anwendung. Der Standard-Pool bleibt
; unangetastet, falls auf dieser Maschine je etwas anderes PHP fahren soll.
[bierexpert]

; Läuft als roger und nicht als www-data. Grund: Die Anwendung sucht ihre
; Konfiguration im Heimatverzeichnis des Benutzers, unter dem PHP läuft
; (siehe api/intern/konfiguration.php). Als www-data landete die Suche bei
; /var/www/.bierexpert/ — und die Zugangsdaten liegen bei roger.
user = roger
group = roger

; Der Socket gehört www-data, damit nginx hineinsprechen darf. 0660 und
; nicht 0666: Es ist ein Weg, PHP als roger auszuführen — den soll nicht
; jeder auf der Maschine gehen können.
listen = /run/php/php-fpm-bierexpert.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Nach so vielen Anfragen startet ein Arbeiter neu. Gegen Speicherlecks in
; langen Läufen; bei dieser Last praktisch nie erreicht.
pm.max_requests = 200

; Der Kern des ganzen Umzugs: KEINE Zeitgrenze für die Anfrage.
;
; Hostpoint hat PHP-Anfragen nach rund 27 Sekunden mit 502 gekappt, und
; weder set_time_limit(0) im Code noch die 300 s in der Konfiguration
; konnten daran etwas ändern — die Grenze sass ausserhalb von PHP. Genau
; diese Stellschraube ist es, und hier gehört sie uns.
request_terminate_timeout = 0

; Beide Protokolle liegen unter /var/log/bierexpert/ und nicht direkt in
; /var/log: Das Langsam-Protokoll schreibt der FPM-Hauptprozess als root, das
; Fehlerprotokoll aber der Arbeiter — und der läuft als roger. In /var/log
; (root, drwxr-xr-x) kann er keine Datei anlegen; PHP fällt dann still auf
; stderr zurück, und die Meldungen landen im nginx-Protokoll, wo sie niemand
; sucht. Genau das ist beim ersten Aufbau passiert.
;
; Eine Anfrage, die länger als so lange läuft, wird ins Langsam-Protokoll
; geschrieben — mit Stapelabzug. Abgebrochen wird sie nicht. Damit sieht
; man kalte Modelle im Protokoll, statt sie zu erraten.
slowlog = /var/log/bierexpert/fpm-langsam.log
request_slowlog_timeout = 30s

; Fehler in ein eigenes Protokoll: Die Endpunkte schreiben ihre Diagnose mit
; error_log(), und in einem gemeinsamen Protokoll ginge sie unter.
php_admin_value[error_log] = /var/log/bierexpert/fpm-fehler.log
php_admin_flag[log_errors] = on
; Fehler gehören nie in die Antwort — eine PHP-Warnung vor dem JSON macht
; die Antwort für das Frontend unlesbar.
php_admin_flag[display_errors] = off

; Muss mindestens so gross sein wie client_max_body_size im vhost.
php_admin_value[post_max_size] = 16M
php_admin_value[upload_max_filesize] = 16M
; Ein Bild von 8 MB liegt als base64 und als dekodierter String gleichzeitig
; im Speicher, dazu die Antwort des Modells. 512M ist reichlich und immer
; noch weit von dem entfernt, was der Maschine wehtut.
php_admin_value[memory_limit] = 512M
; Dieselbe Begründung wie oben, eine Ebene tiefer.
php_admin_value[max_execution_time] = 0
php_admin_value[max_input_time] = -1
; Die Modellantwort kommt über curl; das zählt PHP unter Unix ohnehin nicht
; als Ausführungszeit. Steht hier trotzdem, damit keine Ebene übrig bleibt,
; an der jemand später eine Grenze wiederfindet.
php_admin_value[default_socket_timeout] = 600

; Der Pfad zur Konfiguration ausdrücklich, statt ihn über das
; Heimatverzeichnis erraten zu lassen. Damit steht die Anwendung auch dann
; noch, wenn die posix-Erweiterung einmal fehlt — und man sieht an dieser
; Stelle, welche Datei gemeint ist.
env[BIEREXPERT_KONFIG] = /home/roger/.bierexpert/konfiguration.php
