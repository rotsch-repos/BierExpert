# Vorlage — wird von deploy/lokal/einrichten.sh nach
# /etc/nginx/sites-available/bierexpert installiert und dort verlinkt.
#
# Nur 127.0.0.1: Öffentlich macht diese Seite allein der Cloudflare-Tunnel.
# Ein Lauschen auf 0.0.0.0 wäre eine zweite, ungewollte Tür ins Netz — und
# die Ratenbegrenzung des Tunnels läge davor, diese Tür aber daneben.
server {
    listen 127.0.0.1:8300;
    server_name bierexpert.de www.bierexpert.de localhost;

    # Zeigt auf einen Symlink, nicht auf ein Verzeichnis. Umgeschaltet wird
    # durch Umhängen des Symlinks — siehe ausliefern.sh.
    root /srv/bierexpert/aktuell;
    index index.html;

    # Der Server nimmt Bilder bis 8 MB dekodiert an; als base64 im JSON-Rumpf
    # wird daraus rund ein Drittel mehr. 16M lässt Luft, ohne dass jemand den
    # Speicher mit einem Upload in Bedrängnis bringt. Muss zu post_max_size
    # im FPM-Pool passen — die kleinere der beiden Zahlen gewinnt, und wenn
    # nginx die kleinere hat, sieht PHP die Anfrage nie und kann auch nicht
    # erklären, was fehlt.
    client_max_body_size 16m;

    access_log /var/log/nginx/bierexpert-zugriff.log;
    error_log  /var/log/nginx/bierexpert-fehler.log;

    # Die Dateien in intern/ definieren nur Funktionen und tun beim direkten
    # Aufruf nichts — aber sie gehen niemanden etwas an. Diese Regel steht
    # VOR der PHP-Regel: nginx prüft Regex-Orte in der Reihenfolge der
    # Datei, und die erste, die passt, gewinnt.
    location ~ ^/api/intern/ {
        deny all;
    }

    location ~ ^/api/.+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm-bierexpert.sock;

        # Der Grund, warum hier steht, was das Snippet schon gesetzt hat:
        # $document_root ist der Symlink-Pfad und bleibt über alle Stände
        # hinweg derselbe. PHPs Opcache merkt sich Bytecode unter genau
        # diesem Pfad — nach einer Umschaltung liefe der alte Code weiter,
        # obwohl neue Dateien daliegen. $realpath_root löst den Symlink auf;
        # jeder Stand bekommt damit seinen eigenen Pfad und seinen eigenen
        # Eintrag im Opcache.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Eine Auswertung darf dauern: kaltes 30b-Modell heisst 60–90 s
        # Aufwärmen und danach die eigentliche Rechenzeit. Die Vorgabe von
        # 60 s wäre genau der Killer, dessentwegen wir umgezogen sind.
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;

        # Der Fortschritts-Strom aus Phase C soll Zeile für Zeile beim
        # Browser ankommen und nicht am Stück am Ende. Puffern macht aus dem
        # Strom wieder eine lange Stille.
        fastcgi_buffering off;
        gzip off;
    }

    # Alles andere ist die gebaute Einseitenanwendung.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
