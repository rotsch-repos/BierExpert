# Vorlage — wird von deploy/lokal/einrichten.sh nach
# /etc/logrotate.d/bierexpert installiert.
#
# Ohne Rotation wächst vor allem das Zugriffsprotokoll unbegrenzt. Vier
# Wochen sind lange genug, um einer Beschwerde nachzugehen, und kurz genug,
# dass niemand Besuchsspuren länger aufbewahrt als nötig.
/var/log/bierexpert/*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    # Die Dateien gehören roger (FPM-Arbeiter) bzw. root (nginx). create
    # legt die neue Datei mit denselben Rechten an wie das Verzeichnis.
    create 0640 roger adm
    sharedscripts
    postrotate
        # Beide Dienste halten ihre Protokolldateien offen und schrieben
        # sonst weiter in die weggedrehte Datei.
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)" || true
        systemctl reload php8.3-fpm >/dev/null 2>&1 || true
    endscript
}
