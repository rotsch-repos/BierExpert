name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probelauf:
        description: 'Nur zeigen, was sich ändern würde — nichts ausliefern'
        type: boolean
        default: false

# Zwei Deployments gleichzeitig würden sich im Wurzelverzeichnis in die Quere
# kommen. cancel-in-progress bleibt aus: ein laufendes Deploy abzubrechen
# könnte einen halben Stand hinterlassen.
concurrency:
  group: deploy-produktion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Dieselben Prüfungen wie bei jedem Push — nicht kopiert, sondern aufgerufen.
  pruefen:
    uses: ./.github/workflows/ci.yml

  ausliefern:
    name: Auf den Server ausliefern
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Über die Umgebung lassen sich in den Repo-Einstellungen eine Freigabe
    # und die Adresse hinterlegen; Secrets können daran gebunden werden.
    environment:
      name: produktion
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen
        run: npm run build

      - name: Einstellungen prüfen
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          DOCROOT: ${{ vars.DEPLOY_DOCROOT }}
          BASIS: ${{ vars.DEPLOY_BASIS }}
        run: |
          fehlt=0
          for name in HOST USER DOCROOT BASIS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository-Variable DEPLOY_${name} ist nicht gesetzt."
              fehlt=1
            fi
          done
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && { echo "::error::Secret SSH_PRIVATE_KEY fehlt."; fehlt=1; }
          [ -z "${{ secrets.SSH_KNOWN_HOSTS }}" ] && { echo "::error::Secret SSH_KNOWN_HOSTS fehlt."; fehlt=1; }
          exit $fehlt

      - name: SSH einrichten
        env:
          SCHLUESSEL: ${{ secrets.SSH_PRIVATE_KEY }}
          BEKANNTE_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Ohne 600 lehnt ssh den Schlüssel ab.
          printf '%s\n' "$SCHLUESSEL" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Der Fingerabdruck des Servers kommt aus einem Secret. Ein
          # StrictHostKeyChecking=no würde jeden Server akzeptieren, der sich
          # unter dieser Adresse meldet — das ist der Punkt, an dem sich
          # jemand dazwischenschalten könnte.
          printf '%s\n' "$BEKANNTE_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host ${{ vars.DEPLOY_HOST }}
            User ${{ vars.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG
          chmod 600 ~/.ssh/config

      # Vor dem Ausliefern: Sonst stünden die Endpunkte einen Augenblick lang
      # ohne Zugangsdaten da und meldeten "Server noch nicht eingerichtet".
      - name: Konfiguration auf den Server schreiben
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORT: ${{ secrets.DB_PASSWORT }}
          # Die Adresse zeigt auf den Rechner zu Hause, an dem das Modell
          # hängt — deshalb ein Secret und keine Variable.
          LLM_ENDPUNKT: ${{ secrets.LLM_ENDPUNKT }}
          LLM_SCHLUESSEL: ${{ secrets.LLM_SCHLUESSEL }}
          LLM_MODELL: ${{ vars.LLM_MODELL }}
          LLM_MODELL_SCHNELL: ${{ vars.LLM_MODELL_SCHNELL }}
        run: ./deploy/konfiguration.sh

      - name: Ausliefern
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DOCROOT: ${{ vars.DEPLOY_DOCROOT }}
          DEPLOY_BASIS: ${{ vars.DEPLOY_BASIS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_BEHALTEN: ${{ vars.DEPLOY_BEHALTEN || '5' }}
          MARKE: ${{ github.run_number }}-${{ github.sha }}
          PROBELAUF: ${{ inputs.probelauf && 'ja' || 'nein' }}
        run: ./deploy/ausliefern.sh

      - name: Nachsehen, ob die Seite antwortet
        if: ${{ vars.DEPLOY_URL != '' && !inputs.probelauf }}
        run: |
          echo "Die Dateien sind ausgeliefert. Jetzt die Erreichbarkeit prüfen:"
          echo "  ${{ vars.DEPLOY_URL }}"
          echo

          # Ohne -f: ein Fehlerstatus soll als Zahl zurückkommen statt als
          # Abbruch. Die Zahl ist hier die eigentliche Auskunft.
          abrufen() {
            curl -sS -L -o /tmp/seite.html -w '%{http_code}' "$1" 2>/tmp/curl.err || echo 000
          }

          for versuch in 1 2 3; do
            status=$(abrufen "${{ vars.DEPLOY_URL }}")
            [ "$status" = "200" ] && break
            echo "Versuch $versuch: HTTP $status — nochmal in 5 s"
            sleep 5
          done

          # Kommt über https nichts zurück, kann es am Zertifikat liegen und
          # nicht an der Auslieferung. Ein Blick über http trennt die beiden
          # Fälle — sonst steht hier nur "geht nicht", ohne zu sagen, woran.
          if [ "$status" != "200" ]; then
            klartext="${{ vars.DEPLOY_URL }}"
            case "$klartext" in
              https://*)
                echo "Über https kein Erfolg. Zum Vergleich dasselbe über http:"
                unsicher="http://${klartext#https://}"
                status_http=$(abrufen "$unsicher")
                echo "  $unsicher → HTTP $status_http"
                if [ "$status_http" = "200" ] && grep -q 'Bier Expert' /tmp/seite.html; then
                  echo "::error title=Ausgeliefert und erreichbar, aber ohne Zertifikat::Über http antwortet die richtige Seite, über https nicht (HTTP $status). Die Auslieferung ist also in Ordnung; es fehlt das TLS-Zertifikat für die Domain. Sobald es ausgestellt ist, im Panel des Anbieters die HTTPS-Erzwingung einschalten."
                  exit 1
                fi
                ;;
            esac
            echo "Meldung des Abrufs:"; cat /tmp/curl.err 2>/dev/null || true
            echo "::error title=Ausgeliefert, aber nicht erreichbar::HTTP $status. Die Dateien liegen auf dem Server, das Deploy selbst ist durchgelaufen. Was fehlt, gehört zur Einrichtung beim Anbieter: Ist die Website aktiv geschaltet, zeigt die DNS-Auflösung dorthin, und ist das Zertifikat ausgestellt? Wer währenddessen grüne Läufe möchte, leert die Variable DEPLOY_URL."
            exit 1
          fi

          grep -q 'Bier Expert' /tmp/seite.html \
            || { echo "::error::HTTP 200, aber der Titel fehlt — antwortet dort die richtige Seite?"; exit 1; }
          echo "Erreichbar, HTTP 200, Titel stimmt."

      # Ob die Seite lädt, sagt nichts darüber, ob eine Auswertung durchkäme.
      # Dieser Endpunkt beantwortet in einem Aufruf, ob PHP, Datenbank und
      # Modell stehen — ohne ihn beginnt jede Fehlersuche mit Raten.
      - name: Nachsehen, ob die Endpunkte bereit sind
        if: ${{ vars.DEPLOY_URL != '' && !inputs.probelauf }}
        continue-on-error: true
        run: |
          befund=$(curl -sS -L -m 60 "${{ vars.DEPLOY_URL }}/api/gesundheit.php" || echo '{}')
          echo "$befund" | python3 -m json.tool 2>/dev/null || echo "$befund"

          bereit=$(echo "$befund" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("bereit", False))' 2>/dev/null || echo False)

          # Bewusst kein harter Abbruch: Die Auslieferung ist an dieser
          # Stelle durch und in Ordnung. Was hier fehlt, liegt am Rechner mit
          # dem Modell oder an der Datenbank — beides lässt sich nachziehen,
          # ohne neu auszuliefern.
          if [ "$bereit" != "True" ]; then
            echo "::warning title=Ausgeliefert, aber noch nicht auswertbar::Die Seite steht, \
          aber /api/gesundheit.php meldet nicht bereit. Der Befund oben sagt, woran es liegt."
          else
            echo "Alles bereit: PHP, Datenbank und Sprachmodell antworten."
          fi

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/id_deploy
